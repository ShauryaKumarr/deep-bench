<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070d1c" />
    <meta name="description" content="A daily football quiz. Seven prompts, 25 seconds each. Name the most obscure player you can and climb the football pyramid." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Deep Bench</title>
  </head>
  <body>
    <a class="skip" href="#screen">Skip to game</a>
    <div class="backdrop" aria-hidden="true"><canvas id="backdrop"></canvas></div>
    <button class="sound-toggle" id="sound" type="button" aria-pressed="false">
      <svg viewBox="0 0 11 9" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M0 3h2v3h-2zM2 2h1v5h-1zM3 1h1v7h-1zM4 0h1v9h-1z" />
        <path class="sound-toggle__waves" fill="currentColor" d="M6 3h1v3h-1zM8 2h1v1h-1zM9 3h1v3h-1zM8 6h1v1h-1z" />
        <path class="sound-toggle__mute" fill="currentColor" d="M6 2h1v1h-1zM7 3h1v1h-1zM8 4h1v1h-1zM9 5h1v1h-1zM10 6h1v1h-1zM10 2h1v1h-1zM9 3h1v1h-1zM7 5h1v1h-1zM6 6h1v1h-1z" />
      </svg>
      <span class="sound-toggle__label">Sound off</span>
    </button>
    <div class="app">
      <aside class="pyramid" id="pyramid" aria-label="Your place in the football pyramid"></aside>
      <main class="main">
        <header class="masthead">
          <h1 class="wordmark">Deep Bench</h1>
          <p class="tagline">Scout the unknowns. Climb the pyramid.</p>
          <p class="dayline" id="dayline"></p>
        </header>
        <section id="screen" class="screen" tabindex="-1" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
